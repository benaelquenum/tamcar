# TamCar — Supabase project configuration
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "tamcar"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://tamcar.bj", "https://tamcar.app"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.sms.twilio]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false

# --- Edge functions ---
# Meta n'envoie aucun JWT sur le webhook WhatsApp : l'authenticité est
# garantie par la signature X-Hub-Signature-256, vérifiée dans le code.
[functions.tamy-webhook]
verify_jwt = false

# Appelée uniquement par le trigger SQL via pg_net, avec la clé service role.
[functions.tamy-notify]
verify_jwt = true

# FedaPay n'envoie aucun JWT sur son webhook : l'authenticité est garantie par la signature HMAC (secret
# FEDAPAY_WEBHOOK_SECRET), vérifiée dans le code ; la fonction refuse tout si le secret est absent.
[functions.fedapay-webhook]
verify_jwt = false

# Appelées par l'application ou la base avec un jeton valide : la vérification du jeton reste active.
[functions.fedapay-payout]
verify_jwt = true

[functions.send-push]
verify_jwt = true
